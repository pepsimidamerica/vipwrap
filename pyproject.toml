[project]
name = "vipwrap"
version = "0.2"
description = "Python package that allows interacting with VIP."
readme = "README.md"
authors = [{ name = "Jordan Maynor", email = "jmaynor@pepsimidamerica.com" }]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.5",
    "pandera>=0.26.1",
    "paramiko>=4.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/pepsimidamerica/vipwrap"

[build-system]
requires = ["uv_build>=0.7.7,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vipwrap"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "python-dotenv>=1.1.0",
]
