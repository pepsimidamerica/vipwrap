[project]
name = "vipwrap"
version = "0.1.3"
description = "Python package that allows interacting with VIP."
readme = "README.md"
authors = [{ name = "Jordan Maynor", email = "jmaynor@pepsimidamerica.com" }]
requires-python = ">=3.13"
dependencies = ["pandas>=2.3.0", "pandera>=0.24.0", "paramiko>=3.5.1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: The Unlicense (Unlicense)",
    "Operating System :: OS Independent",
]
license = { file = "LICENSE" }

[project.urls]
Homepage = "https://github.com/pepsimidamerica/vipwrap"

[build-system]
requires = ["uv_build>=0.7.7,<0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vipwrap"
module-root = ""

[dependency-groups]
dev = ["python-dotenv>=1.1.0"]
